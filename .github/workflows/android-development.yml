name: Build Z-Dim Android development package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-plugin-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Obtain exact Godot interface and Android SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          curl --fail --location --output "$RUNNER_TEMP/godot.aar" https://repo.maven.apache.org/maven2/org/godotengine/godot/4.6.3.stable/godot-4.6.3.stable.aar
      - name: Compile plugin and exercise real ONNX Runtime bridge
        run: |
          gradle -p android_ai "-PgodotAar=$RUNNER_TEMP/godot.aar" installPlugin testReleaseUnitTest --no-daemon
          mkdir -p build/java-tests
          javac -d build/java-tests android_ai/src/main/java/org/questphoto/depth/DepthFile.java android_ai/tests/DepthFileTest.java
          java -cp build/java-tests DepthFileTest
          python -m unittest discover -s tests -p test_apk_builder.py -v
      - name: Package source, compiled plugin and runtime
        run: python tools/package_android_development.py --id "$GITHUB_RUN_NUMBER$GITHUB_RUN_ATTEMPT"
      - name: Publish one complete development package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_id="$GITHUB_RUN_NUMBER$GITHUB_RUN_ATTEMPT"
          gh release create "zdim-0.3.0-android-dev${build_id}" build/distribution/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Z-Dim 0.3.0 Android development ${build_id}" \
            --notes-file docs/ANDROID_BUILD_QUICKSTART.md
      - name: Preserve test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android_ai/build/reports/tests/
